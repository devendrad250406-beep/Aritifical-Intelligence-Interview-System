<!DOCTYPE html>

<html>

<head>

    <title>AI Interview System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🤖 AI Interview System</h1>

        <p>
            Practice interviews with AI-powered evaluation.
        </p>


        <form
            action="/start"
            method="POST"
            enctype="multipart/form-data"
        >


            <label>
                Candidate Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>
                Job Role
            </label>

            <input
                type="text"
                name="role"
                placeholder="Example: Python Developer"
                value="Software Developer"
                required
            >


            <label>
                Experience
            </label>

            <select name="experience">

                <option value="Fresher">
                    Fresher
                </option>

                <option value="0-1 year">
                    0-1 year
                </option>

                <option value="1-3 years">
                    1-3 years
                </option>

                <option value="3+ years">
                    3+ years
                </option>

            </select>


            <label>
                Resume PDF
            </label>

            <input
                type="file"
                name="resume"
                accept=".pdf"
            >


            <button type="submit">
                Start AI Interview 🚀
            </button>


        </form>

    </div>

</div>

</body>

</html>
